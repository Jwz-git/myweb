services:
  jwz-blog:
    container_name: jwz-blog
    build:
      context: ../..
      dockerfile: deploy/monolith/Dockerfile
    restart: unless-stopped
    env_file: ../../.env
    environment:
      DATABASE_URL: "postgres://blog:${POSTGRES_PASSWORD}@127.0.0.1:5432/blog"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    ports: ["80:80"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]

volumes:
  postgres_data: {}
